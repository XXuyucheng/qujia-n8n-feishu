# feishu-files-generation 模板与占位符映射
# 将 template_token / folder_token 替换为真实飞书 token，或通过环境变量注入 defaults。
#
# 输出目录选择（优先级高→低）：
#   1. 请求 folder_token（原始飞书 folder token）
#   2. 请求 output_folder（下方 output_folders 别名）
#   3. 模板 output_folder / folder_token
#   4. defaults.folder_token / defaults.output_folder

defaults:
  template_token: "${FEISHU_CONTRACT_TEMPLATE_TOKEN}"
  folder_token: "${FEISHU_CONTRACT_OUTPUT_FOLDER}"
  document_name_pattern: "{订单号}"
  required_placeholders:
    - 甲方名称
    - 乙方名称
    - 活动费用
    - 活动日期
  rate_limit:
    read_qps: 4.0
    write_qps: 3.0
    copy_retry_max: 3
    copy_retry_delay_ms: 800
    batch_size: 20
    batch_delay_ms: 350

# 命名输出目录：n8n 传 output_folder 别名即可，无需在工作流里硬编码 folder token
output_folders:
  趣加旅社合同: "UtBAfoddYlwW3tdA6FTcwiImn1c"
  趣伽团建合同: "HgX1feLiBlORwvdslj3cJX9mnzf"
