    template_token: "QyyUdUdXYoXzklxSUUGcanmenoh"
    output_folder: 趣加旅社合同
    document_name_pattern: "趣加旅行社活动合同{订单号}"
    party_b_full_name: "杭州趣加旅行社服务有限公司"
    # 文末追加费用明细 / 行程明细内嵌 Sheet（fields.费用明细 / fields.活动行程）
    append_detail_sheets: true
    detail_sheets:
      style:
        h_align: center          # sheet cells: left | center | right
        v_align: center          # top | center | bottom
        font_size: "10pt/1.5"
        header_bold: true
        title_align: left        # H2 title: left | center | right
      fee:
        title: 费用明细
        columns:
          - { field: 分类, header: 分类, width: 75 }
          - { field: 名称, header: 名称, width: 120 }
