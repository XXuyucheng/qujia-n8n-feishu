  在线报价:
    type: spreadsheet
    template_token: "DHnusjhhShGzT2t5HCzcqsnHncg"
    output_folder: 在线报价
    document_name_pattern: "{活动名称}-{订单号}"
    required_placeholders: []
    placeholders:
      活动名称: "{活动名称}"
      报价人数: "{报价人数}"
      活动天数: "{活动天数}"
      活动日期: "{活动日期}"
      出发地目的地: "{出发地目的地}"
      税费及服务: "{税费及服务}"
    sheet:
      # 第 9、10 行为空白锚点；二者之间插行写 A–E 与 G 后删除这两个锚点空行，再写公式
      insert_after_row: 9
      insert_before_row: 10
      max_rows: 80
      columns:
        - field: 类目
          col: A
        - field: 物品名称
          col: B
        - field: 描述
          col: C
        - field: 数量
          col: D
        - field: 单价
          col: E
        - field: 数量
          col: G
      # inheritStyle 不继承公式；插行后由服务写入行公式与活动总价行公式
      formula:
        line_total_col: F
        line_total: '=IF(OR(D{row}="",E{row}=""),"",D{row}*E{row})'
        profit_line_col: I
        profit_line: '=IF(OR(G{row}="",H{row}=""),"",G{row}*H{row})'
        total_label: 活动总价（含税）
        tax_label: 税费及服务
        total_amount_col: D
        profit_sum_col: H
        total_diff_col: I
        profit_sum: "=SUM(I{start}:I{end})"
        total_diff: "=D{row}-H{row}"
      # 原始模板第 15 行上方插行程；运行时按报价净增行数偏移
      itinerary:
        insert_before_row: 15
        max_rows: 80
        columns:
          - field: 日期
            col: A
          - field: 时间
            col: B
          - field: 内容
            col: C

