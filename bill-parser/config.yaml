# 微信账单分类规则：自上而下，命中即停。
# peer / item / tx_type 为逗号分隔关键词，任一字段包含即匹配。
default_category: 未分类

rules:
  - category: 餐饮
    peer: 美团,饿了么,肯德基,麦当劳,星巴克,瑞幸,茶百道,喜茶,海底捞,外卖
    item: 餐饮,外卖,美食

  - category: 交通
    peer: 滴滴,嘀嘀,高德打车,哈啰,青桔,铁路12306,中国石油,中国石化
    item: 打车,加油,地铁,公交

  - category: 购物
    peer: 淘宝,天猫,京东,拼多多,抖音电商,特约商户
    item: 购物,电子商务

  - category: 生活缴费
    peer: 网上国网,国家电网,水费,燃气
    item: 电费,水费,燃气费,话费

  - category: 转账红包
    tx_type: 转账,微信红包,红包

  - category: 收入
    peer: 现金奖励
    tx_type: 二维码收款
    item: 微信红包
