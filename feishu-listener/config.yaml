retention:
  max_days: 7
  max_events: 5000
  # Keep false unless running a deliberate low-traffic compact; VACUUM rewrites the whole file.
  vacuum_after_cleanup: false

storage:
  ignored_raw_mode: summary
  matched_raw_mode: full

routes:
  - name: invoice-bitable-record-changed # 发票识别
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tblNd9zgN7ALihwj
    actions: record_edited 
    field_conditions:
      - field_id: fldApH5hsr
        equals: optBW7psSG
    n8n_webhook_url: http://n8n:5678/webhook/feishu/invoice
    max_attempts: 3
    timeout_seconds: 10
  - name: invoice-tax-status # 业务回票对税局：识别状态变为已识别
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tblNd9zgN7ALihwj
    actions: record_edited
    field_conditions:
      - field_id: fldApH5hsr
        equals: opt82mjoXE
    n8n_webhook_url: http://n8n:5678/webhook/invoice-tax-status
    max_attempts: 2
    timeout_seconds: 25
  # 发票申请表：发票附件变化就识别这一条。回写识别状态不会再次命中，因为只比较附件前后。
  - name: invoice-application-recognize
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl1qdQwcE3jEjlR
    actions: [record_added, record_edited]
    field_conditions:
      - field_id: fldleNcqtc
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/feishu/invoice-application
    max_attempts: 2
    timeout_seconds: 25
  - name: online-quote-generation # 在线报价 Spreadsheet 生成（附件 / 按需双模式，n8n 内分支）
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl91gZyDPCLhlva
    # 仅编辑；避免与新建等 action 叠加匹配
    actions: record_edited
    field_conditions:
      - field_id: fldGQVeaKb
        equals:
          - optDK1JeDR
          - optSrF4NkL
    n8n_webhook_url: http://n8n:5678/webhook/feishu/quote-test
    # 生成含下载/插行/可选 AI，常 >10s；超时重试会导致同一提交触发多次工作流
    max_attempts: 2
    timeout_seconds: 180
  # 订单成交状态变更 → 写/清空成交日期（须在 online-quote 之后：同表先匹配先停）
  # 含新建即为已成交；n8n 比较 before/after（新建 before 为空），仅状态变化才回写
  - name: order-deal-status-date
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl91gZyDPCLhlva
    actions: [record_added, record_edited]
    field_conditions:
      - field_id: fldel2QAvI
        exists: true
    n8n_webhook_url: http://n8n:5678/webhook/order-deal-status-date
    max_attempts: 3
    timeout_seconds: 10
  - name: record_deleted_backup #删除数据存档
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    actions: record_deleted
    n8n_webhook_url: http://n8n:5678/webhook/record_deleted_backup
    max_attempts: 3
    timeout_seconds: 10
  - name: expense-invoice-title-supplier # 业务支出回票抬头：供应商收款信息变更
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl8jKSb6kHvKlCL
    actions: record_edited
    field_conditions:
      - field_id: fldv6yhJlh
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/expense-invoice-title
    max_attempts: 2
    timeout_seconds: 25
  - name: expense-invoice-title-date # 业务支出回票抬头：申请支出日期变更
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl8jKSb6kHvKlCL
    actions: record_edited
    field_conditions:
      - field_id: fldUhqgLh8
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/expense-invoice-title
    max_attempts: 2
    timeout_seconds: 25
  - name: expense-invoice-title-verify # 业务支出回票抬头：打款核验变更
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl8jKSb6kHvKlCL
    actions: record_edited
    field_conditions:
      - field_id: fldt9HCyb2
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/expense-invoice-title
    max_attempts: 2
    timeout_seconds: 25
  - name: Income_Expenditure_Monitoring # 支出金额变动 
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl8jKSb6kHvKlCL
    actions: record_edited
    field_conditions:
      - field_id: fldw8ab8mV
        exists: true
    n8n_webhook_url: http://n8n:5678/webhook/Income_Expenditure_Monitoring
    max_attempts: 3
    timeout_seconds: 10
  - name: Bill-Re-identification # 合同重新识别
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldYNG02fN
        equals: optELG9msS
    n8n_webhook_url: http://n8n:5678/webhook/Bill-Re-identification
    max_attempts: 3
    timeout_seconds: 10
  # 合同信息整理。生成 Word 的入口，必须写在「提交」两条合同路由前面。
  # 合同生成 fldKtkrkNU 选中「生成word」（optHUwrws1）即触发，三个签约主体都走这里。
  - name: make-contract-info #合同信息整理
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldKtkrkNU
        equals:
          - 生成word
          - optHUwrws1
    n8n_webhook_url: http://n8n:5678/webhook/make-contract-info
    max_attempts: 2
    timeout_seconds: 60
  # 趣加旅社单独合同。必须写在 make-contract 前面：监听器第一条命中即停止。
  # 签约单位 fldSaTx0aY 是查找引用，事件里可能是「趣加旅社」或选项 id。
  # 若一次真实「提交」的事件里没有该字段，本路由不会命中，记录仍进旧工作流。
  - name: make-contract-qujia #趣加旅社合同占位符
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldKtkrkNU
        equals: opt3Grubt2
      - field_id: fldSaTx0aY
        equals:
          - 趣加旅社
          - optwCTYuUU
    n8n_webhook_url: http://n8n:5678/webhook/make-contract-qujia
    max_attempts: 2
    timeout_seconds: 60
  - name: make-contract #合同生成
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldKtkrkNU
        equals: opt3Grubt2
    n8n_webhook_url: http://n8n:5678/webhook/make-contract-online
    max_attempts: 3
    timeout_seconds: 10
  - name: invoice-tax-status-check # 发票税务状态校验（群内发「发票号校验」+ Excel；主应用 n8n）
    enabled: true
    dispatch_enabled: true
    event_type: im.message.receive_v1
    app_id: cli_a94bb777f63a5bce
    chat_id: oc_546b26752d3d6763463f81344c7e77ef
    text_contains: 发票号校验
    n8n_webhook_url: http://n8n:5678/webhook/invoice-tax-check
    max_attempts: 2
    timeout_seconds: 25
  - name: feishu-bot-im-message # 飞书对话机器人（对话专用应用 · Skill 平台）
    enabled: true
    dispatch_enabled: true
    event_type: im.message.receive_v1
    app_id: cli_a940966ee8385bd7
    n8n_webhook_url: http://feishu-bot:8040/api/message
    max_attempts: 2
    timeout_seconds: 25
  # 供应商多维表 → 趣加资源知识库。走 n8n，禁止接到 feishu-bot /api/message。
  # 知识库未就绪前保持停用；启用前先导入 feishu-bot/n8n/kb-sync-bitable.workflow.json
  - name: kb-sync-bitable
    enabled: false
    dispatch_enabled: false
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl4vQ8kft1XXSLv
    n8n_webhook_url: http://n8n:5678/webhook/kb-sync-bitable
    max_attempts: 2
    timeout_seconds: 60
  - name: make-plan #计划单生成
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldteSNWR4
        equals: optlgDi8dC
    n8n_webhook_url: http://n8n:5678/webhook/make-plan
    max_attempts: 3
  - name: make-plan-blank # 空计划单：按提交者目录复制空模板
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldteSNWR4
        equals: optMXz7IGC
    n8n_webhook_url: http://n8n:5678/webhook/make-plan-blank
    max_attempts: 3
    timeout_seconds: 25
  # 流水表「收款识别输出」文本变化后拆成五个文本字段。飞书 after_value 是整行，须比较前后文本。
  - name: flow-receipt-parse
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tblqObCmK0l85u9s
    actions: record_edited
    field_conditions:
      - field_id: fldjoj1LvB
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/flow-receipt-parse
    max_attempts: 3
    timeout_seconds: 10
  # 流水表「支出凭证识别.输出结果」文本变化后拆成三段写入。同样比较前后文本，避免整行快照误触发。
  # 须排在 flow-receipt-parse 之后：同一次编辑若两个输出字段都变了，收款路由先命中。
  - name: flow-expense-parse
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tblqObCmK0l85u9s
    actions: record_edited
    field_conditions:
      - field_id: fldQGhB7d7
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/flow-expense-parse
    max_attempts: 3
    timeout_seconds: 10
  # 客户表「自动识别」写入非空内容后拆成五个文本字段。飞书 after_value 是整行，须比较这一格的前后文本。
  # 回写联系人名称等字段不会再次命中。空文本仍会进工作流，由工作流跳过，不把已有五列改成「无」。
  - name: customer-auto-parse
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tblplCg1voA7Xjgi
    actions: [record_added, record_edited]
    field_conditions:
      - field_id: fld0NkQAqg
        changed: true
    n8n_webhook_url: http://n8n:5678/webhook/customer-auto-parse
    max_attempts: 2
    timeout_seconds: 30
