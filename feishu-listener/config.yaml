retention:
  max_days: 7
  max_events: 5000
  # Keep false unless running a deliberate low-traffic compact; VACUUM rewrites the whole file.
  vacuum_after_cleanup: false

storage:
  ignored_raw_mode: summary
  matched_raw_mode: full

routes:
  - name: invoice-bitable-record-changed # 发票识别
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tblNd9zgN7ALihwj
    actions: record_edited 
    field_conditions:
      - field_id: fldApH5hsr
        equals: optBW7psSG
    n8n_webhook_url: http://n8n:5678/webhook/feishu/invoice
    max_attempts: 3
    timeout_seconds: 10
  - name: online-quote-generation # 在线报价 Spreadsheet 生成（附件 / 按需双模式，n8n 内分支）
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl91gZyDPCLhlva
    # 仅编辑；避免与新建等 action 叠加匹配
    actions: record_edited
    field_conditions:
      - field_id: fldGQVeaKb
        equals:
          - optDK1JeDR
          - optSrF4NkL
    n8n_webhook_url: http://n8n:5678/webhook/feishu/quote-test
    # 生成含下载/插行/可选 AI，常 >10s；超时重试会导致同一提交触发多次工作流
    max_attempts: 2
    timeout_seconds: 180
  - name: record_deleted_backup #删除数据存档
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    actions: record_deleted
    n8n_webhook_url: http://n8n:5678/webhook/record_deleted_backup
    max_attempts: 3
    timeout_seconds: 10
  - name: Income_Expenditure_Monitoring # 支出金额变动 
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl8jKSb6kHvKlCL
    actions: record_edited
    field_conditions:
      - field_id: fldw8ab8mV
        exists: true
    n8n_webhook_url: http://n8n:5678/webhook/Income_Expenditure_Monitoring
    max_attempts: 3
    timeout_seconds: 10
  - name: Bill-Re-identification # 合同重新识别
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldYNG02fN
        equals: optELG9msS
    n8n_webhook_url: http://n8n:5678/webhook/Bill-Re-identification
    max_attempts: 3
    timeout_seconds: 10
  - name: make-contract #合同生成
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldKtkrkNU
        equals: opt3Grubt2
    n8n_webhook_url: http://n8n:5678/webhook/make-contract-online
    max_attempts: 3
    timeout_seconds: 10
  - name: invoice-tax-status-check # 发票税务状态校验（群内发「发票号校验」+ Excel；主应用 n8n）
    enabled: true
    dispatch_enabled: true
    event_type: im.message.receive_v1
    app_id: cli_a94bb777f63a5bce
    chat_id: oc_546b26752d3d6763463f81344c7e77ef
    text_contains: 发票号校验
    n8n_webhook_url: http://n8n:5678/webhook/invoice-tax-check
    max_attempts: 2
    timeout_seconds: 25
  - name: feishu-bot-im-message # 飞书对话机器人（对话专用应用 · Skill 平台）
    enabled: true
    dispatch_enabled: true
    event_type: im.message.receive_v1
    app_id: cli_a940966ee8385bd7
    n8n_webhook_url: http://feishu-bot:8040/api/message
    max_attempts: 2
    timeout_seconds: 25
  - name: make-plan #计划单生成
    enabled: true
    dispatch_enabled: true
    event_type: drive.file.bitable_record_changed_v1
    app_token: Y2ZgbUGWqa0MB4sLmXxc89T5n0P
    table_id: tbl821KbTBpjjyXI
    actions: record_edited
    field_conditions:
      - field_id: fldteSNWR4
        equals: optlgDi8dC
    n8n_webhook_url: http://n8n:5678/webhook/make-plan
    max_attempts: 3
