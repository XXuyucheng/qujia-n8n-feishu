services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.11.3
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./files:/files
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - TZ=Asia/Shanghai
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_BASE_ID=${FEISHU_BASE_ID}
      - FEISHU_TABLE_ID=${FEISHU_TABLE_ID}
      - FEISHU_CHAT_ID=${FEISHU_CHAT_ID}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_API_URL=${VISION_API_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      - VISION_MODEL=${VISION_MODEL:-gpt-4o-mini}
    restart: unless-stopped

  pdf-parser:
    build:
      context: ./pdf-parser
      args:
        BASE_IMAGE: ${PDF_PARSER_BASE_IMAGE:-docker.1ms.run/library/python:3.12-slim}
    container_name: pdf-parser
    ports:
      - "8000:8000"
    restart: unless-stopped

  feishu-listener:
    build:
      context: ./feishu-listener
      args:
        BASE_IMAGE: ${FEISHU_LISTENER_BASE_IMAGE:-docker.1ms.run/library/python:3.12-slim}
    container_name: feishu-listener
    ports:
      - "8010:8010"
    volumes:
      - ./feishu-listener/config.yaml:/app/config.yaml:ro
      - ./feishu-listener/data:/data
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY}
      - FEISHU_CHAT_APP_ID=${FEISHU_CHAT_APP_ID}
      - FEISHU_CHAT_APP_SECRET=${FEISHU_CHAT_APP_SECRET}
      - FEISHU_CHAT_VERIFICATION_TOKEN=${FEISHU_CHAT_VERIFICATION_TOKEN:-}
      - FEISHU_CHAT_ENCRYPT_KEY=${FEISHU_CHAT_ENCRYPT_KEY:-}
      - LISTENER_CONFIG_PATH=/app/config.yaml
      - LISTENER_DB_PATH=/data/events.sqlite
      - LISTENER_PORT=8010
      - LOG_LEVEL=INFO
      - ENABLE_DEBUG_ENDPOINTS=true
    restart: unless-stopped
    depends_on:
      - feishu-bot

  feishu-field-parser:
    build:
      context: ./feishu-field-parser
      args:
        BASE_IMAGE: ${FEISHU_FIELD_PARSER_BASE_IMAGE:-docker.1ms.run/library/python:3.12-slim}
    container_name: feishu-field-parser
    ports:
      - "8020:8020"
    volumes:
      - ./feishu-field-parser/config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - FIELD_PARSER_CONFIG_PATH=/app/config.yaml
      - FIELD_PARSER_PORT=8020
      - LOG_LEVEL=INFO
    restart: unless-stopped

  feishu-files-generation:
    build:
      context: ./feishu-files-generation
      args:
        BASE_IMAGE: ${FEISHU_FILES_GENERATION_BASE_IMAGE:-docker.1ms.run/library/python:3.12-slim}
    container_name: feishu-files-generation
    ports:
      - "8030:8030"
    volumes:
      - ./feishu-files-generation/config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_FILES_GENERATION_CONFIG_PATH=/app/config.yaml
      - FEISHU_FILES_GENERATION_PORT=8030
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_CONTRACT_TEMPLATE_TOKEN=${FEISHU_CONTRACT_TEMPLATE_TOKEN:-}
      - FEISHU_CONTRACT_OUTPUT_FOLDER=${FEISHU_CONTRACT_OUTPUT_FOLDER:-}
      - FEISHU_DEPARTURE_TEMPLATE_TOKEN=${FEISHU_DEPARTURE_TEMPLATE_TOKEN:-}
      - FEISHU_DEPARTURE_OUTPUT_FOLDER=${FEISHU_DEPARTURE_OUTPUT_FOLDER:-}
      - LOG_LEVEL=INFO
    restart: unless-stopped

  feishu-bot:
    build:
      context: ./feishu-bot
      args:
        BASE_IMAGE: ${FEISHU_BOT_BASE_IMAGE:-docker.1ms.run/library/python:3.12-slim}
    container_name: feishu-bot
    ports:
      - "8040:8040"
    volumes:
      # 挂载源码，改 .py 后 restart 即可生效（依赖仍来自镜像）
      - ./feishu-bot:/app
      - ./feishu-bot/data:/data
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_BOT_CONFIG_DIR=/app/config
      - FEISHU_BOT_DB_PATH=/data/sessions.sqlite
      - FEISHU_BOT_PORT=8040
      - FEISHU_CHAT_APP_ID=${FEISHU_CHAT_APP_ID}
      - FEISHU_CHAT_APP_SECRET=${FEISHU_CHAT_APP_SECRET}
      - FEISHU_BASE_ID=${FEISHU_BASE_ID}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_API_URL=${VISION_API_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      - VISION_MODEL=${VISION_MODEL:-}
      - LOG_LEVEL=INFO
    restart: unless-stopped
