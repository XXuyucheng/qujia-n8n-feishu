rules:
- id: customer_refund
  keywords:
  - 客户退款
  - 客户退回
  - 退款给客户
  set_fields:
    supplier_type: 客户退款
  require_name_pattern: (客户退款\d{6,}|\d{6,}客户退款)
  hint: 检测到客户退款场景：请将供应商名称改为「客户退款+订单号」或「订单号+客户退款」，例如客户退款26071001、26071001客户退款；类型已自动设为客户退款。
dedupe:
  enabled: true
  fields:
  - key: supplier_name
  - key: account_no
  on_hit: ask_overwrite
  on_hit_denied: reject
ai:
  extract_enabled: true    # 仅抽取字段；不把写表/校验交给模型
  chat_enabled: false
  extract_on_incomplete: true
  long_text_chars: 40
attachment:
  field_key: qrcode
reply:
  mode: text
