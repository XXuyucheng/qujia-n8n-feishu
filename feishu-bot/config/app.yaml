# 全局应用配置（对话机器人平台）
session_ttl_minutes: 5
default_locale: zh-CN

router:
  strategy: trigger_first   # trigger_first | menu_only（llm_route 远期）
  ambiguous_reply: |
    请选择要办理的业务，或发送对应指令：
    - 添加供应商 / /供应商
    - 查供应商 / 查价差（只读查询，走 n8n Agent）

ai:
  enabled: true
  extract_enabled: true   # 录入：仅字段抽取，校验仍走 Form Engine
  chat_enabled: false     # 禁止把录入做成自由 Agent 对话
  route_enabled: false
  query_via_n8n: true     # 查询 skill 转发 n8n，不在本进程写表

channels:
  reply_mode: card          # 录入/查询默认互动卡片；校验与写表仍走 Form Engine

# 全局默认口令（skill 未覆盖时使用）
commands:
  cancel: [取消, 算了, cancel]
  confirm: [确认, 确定, 提交, yes, ok]
  skip: [跳过, 无, skip]
  overwrite: [覆盖, 更新]

# 可覆盖已有记录的管理员（飞书 open_id）。空列表=所有人只能新建、不能覆盖。
permissions:
  overwrite_open_ids: [ou_8dd0ac5df99798afe9745d5e0e97d650]
  # 示例：
  # overwrite_open_ids:
  #   - ou_xxxxxxxx

idle_help: |
  进入单聊会收到欢迎卡片。也可点菜单或发送：
  - 添加供应商 / /供应商（录入表单卡片）
  - 查供应商 某某 / 查价差（只读查询，走 n8n Agent）
  录入在卡片提交后由本机器人写表；查询不改表。
  收款码请在对话中发送图片（卡片无法上传附件）。
