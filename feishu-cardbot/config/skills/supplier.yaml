# Skill: 供应商录入（卡片交互机器人 / 与 feishu-bot 字段规则对齐）
# 改完重启 feishu-cardbot 即可，一般无需改代码。

id: supplier
name: 供应商录入
version: 1
enabled: true
triggers:
- 添加供应商
- 录入供应商
- 供应商录入
- /supplier
- /供应商
prompts:
  start: 开始录入供应商。可一次发齐信息，或分多轮补充；补全阶段可发送收款码图片（支持富文本插图）。
  summary_title: 已整理供应商信息
  help_example: '添加供应商：德清某某茶歇

    户名：张三

    账号：6222…

    银行：工行

    地域：德清

    类型：餐厅

    结算类型：月结'
  need_more_hint: 可继续补充文字，或直接发送收款码图片。回复「取消」结束。
  confirm_hint: 请回复「确认」写入多维表格，或继续补充修改；「取消」放弃。
  suggest_hint: 建议补充：{labels}（可继续发送，或回复「跳过」进入确认）
  cancel: 已取消本次供应商录入。
  cancel_overwrite: 已取消，未覆盖已有记录。
  image_before_start: 请先发送「添加供应商」并填写基本信息，再发送收款码图片。
  group_hint: 支付信息（户名+账号+银行名称，或发送收款码图片）
  dedupe_ask: '{detail}

    回复「覆盖」更新已有记录，或「取消」。'
  dedupe_denied: '{detail}

    你没有覆盖权限，请修改后重新提交，或联系管理员。'
  option_missing: '「{label}」选项「{value}」不存在，请核对或联系管理员。'
  account_invalid: '账号必须为纯数字（可含空格，将自动去除），当前值「{value}」无效。'
  success: '{action}供应商「{name}」成功。记录 ID：{record_id}'
commands:
  cancel:
  - 取消
  - 算了
  - cancel
  confirm:
  - 确认
  - 确定
  - 提交
  - true
  - ok
  skip:
  - 跳过
  - 无
  - skip
  overwrite:
  - 覆盖
  - 更新
